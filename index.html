<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <title>电动车充电里程记录</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">EV CHARGE LOG</p>
          <h1>电动车里程</h1>
        </div>
        <div class="top-actions">
          <button class="icon-button" id="importBtn" type="button" aria-label="导入 JSON" title="导入 JSON">导入</button>
          <button class="icon-button primary" id="exportBtn" type="button" aria-label="导出数据" title="导出数据">备份</button>
          <input id="importFile" type="file" accept="application/json,.json" hidden />
        </div>
      </header>

      <section class="hero-panel" aria-label="本次统计">
        <div class="gauge" aria-hidden="true">
          <div class="gauge-ring">
            <span id="avgDistance">--</span>
            <small>km/次</small>
          </div>
        </div>
        <div class="hero-copy">
          <p>平均续航</p>
          <strong id="latestDistance">还没有记录</strong>
          <span id="recordCount">输入第一次总里程后开始追踪</span>
        </div>
      </section>

      <form class="entry-form" id="entryForm" autocomplete="off">
        <label for="mileageInput">当前总里程</label>
        <div class="input-row">
          <input id="mileageInput" name="mileage" type="number" inputmode="decimal" min="0" step="0.1" placeholder="例如 1288.5" required />
          <button type="submit">保存</button>
        </div>
        <p class="form-note" id="formNote">每次充电前输入仪表盘上的总里程。</p>
      </form>

      <section class="stats-grid" aria-label="汇总数据">
        <article>
          <span>最长一次</span>
          <strong id="bestRun">-- km</strong>
        </article>
        <article>
          <span>最短一次</span>
          <strong id="shortRun">-- km</strong>
        </article>
        <article>
          <span>累计记录</span>
          <strong id="totalRecords">0 次</strong>
        </article>
      </section>

      <section class="chart-section" aria-label="每次充电里程图表">
        <div class="section-head">
          <h2>续航趋势</h2>
          <button class="ghost-button" id="clearBtn" type="button">清空记录</button>
        </div>
        <div class="chart-wrap">
          <canvas id="rangeChart" width="680" height="360"></canvas>
          <p class="empty-chart" id="emptyChart">至少保存 2 次总里程后显示每次充电跑了多少公里。</p>
        </div>
      </section>

      <section class="history-section" aria-label="历史记录">
        <div class="section-head">
          <h2>记录</h2>
          <span id="lastUpdated">--</span>
        </div>
        <ol class="history-list" id="historyList"></ol>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
