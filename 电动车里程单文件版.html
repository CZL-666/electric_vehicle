<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <title>电动车充电里程记录</title>
    <style>
:root {
  color-scheme: light;
  --bg: #f6f7f2;
  --ink: #18212f;
  --muted: #6b7280;
  --panel: #ffffff;
  --line: #dde2da;
  --accent: #0f766e;
  --accent-dark: #115e59;
  --warm: #d97706;
  --danger: #b91c1c;
  --shadow: 0 18px 42px rgba(24, 33, 47, 0.1);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 18% -8%, rgba(217, 119, 6, 0.16), transparent 32%),
    linear-gradient(180deg, #eef5f2 0%, var(--bg) 48%, #f8fafc 100%);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

button,
input {
  font: inherit;
}

.app-shell {
  width: min(100%, 520px);
  min-height: 100vh;
  margin: 0 auto;
  padding: max(18px, env(safe-area-inset-top)) 16px max(26px, env(safe-area-inset-bottom));
}

.topbar,
.top-actions,
.section-head,
.input-row,
.history-item {
  display: flex;
  align-items: center;
}

.topbar {
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 16px;
}

.top-actions {
  flex: 0 0 auto;
  gap: 8px;
}

.eyebrow,
.hero-copy p,
.stats-grid span,
.section-head span,
.history-date,
.form-note {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
}

h1,
h2 {
  margin: 0;
  letter-spacing: 0;
}

h1 {
  font-size: 30px;
  line-height: 1.05;
}

h2 {
  font-size: 18px;
}

.icon-button,
.ghost-button,
.input-row button {
  border: 0;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.icon-button {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--ink);
  color: #fff;
  font-size: 24px;
  line-height: 1;
}

.hero-panel,
.entry-form,
.chart-section,
.history-section {
  background: rgba(255, 255, 255, 0.9);
  border: 1px solid rgba(221, 226, 218, 0.9);
  box-shadow: var(--shadow);
}

.hero-panel {
  display: grid;
  grid-template-columns: 128px 1fr;
  gap: 18px;
  align-items: center;
  min-height: 176px;
  padding: 20px;
  border-radius: 8px;
}

.gauge {
  width: 128px;
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: conic-gradient(var(--accent) var(--gauge-value, 0deg), #dfe7e1 0);
}

.gauge-ring {
  width: 96px;
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  align-content: center;
  border-radius: 50%;
  background: #fff;
}

.gauge-ring span {
  font-size: 28px;
  font-weight: 800;
  line-height: 1;
}

.gauge-ring small {
  color: var(--muted);
  font-size: 12px;
  margin-top: 5px;
}

.hero-copy strong {
  display: block;
  margin: 8px 0;
  font-size: 23px;
  line-height: 1.18;
}

.hero-copy span {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.35;
}

.entry-form {
  margin-top: 14px;
  padding: 16px;
  border-radius: 8px;
}

.entry-form label {
  display: block;
  margin-bottom: 10px;
  font-weight: 700;
}

.input-row {
  gap: 10px;
}

.input-row input {
  min-width: 0;
  width: 100%;
  height: 52px;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 0 14px;
  background: #fbfcfa;
  color: var(--ink);
  font-size: 18px;
  outline: none;
}

.input-row input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
}

.input-row button {
  width: 86px;
  height: 52px;
  flex: 0 0 86px;
  border-radius: 8px;
  background: var(--accent);
  color: #fff;
  font-weight: 800;
}

.input-row button:active,
.icon-button:active,
.ghost-button:active {
  transform: translateY(1px);
}

.form-note {
  min-height: 20px;
  margin-top: 10px;
}

.form-note.error {
  color: var(--danger);
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin: 14px 0;
}

.stats-grid article {
  min-height: 82px;
  padding: 13px 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.72);
}

.stats-grid strong {
  display: block;
  margin-top: 9px;
  font-size: 17px;
  line-height: 1.16;
}

.chart-section,
.history-section {
  padding: 16px;
  border-radius: 8px;
}

.history-section {
  margin-top: 14px;
}

.section-head {
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}

.ghost-button {
  min-width: 58px;
  height: 34px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  color: var(--danger);
  font-weight: 700;
}

.chart-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 1.88;
  min-height: 190px;
}

#rangeChart {
  width: 100%;
  height: 100%;
}

.empty-chart {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  margin: 0;
  padding: 22px;
  color: var(--muted);
  text-align: center;
  line-height: 1.45;
}

.history-list {
  display: grid;
  gap: 10px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.history-item {
  justify-content: space-between;
  gap: 12px;
  min-height: 62px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fbfcfa;
}

.history-main strong,
.history-delta {
  display: block;
}

.history-main strong {
  font-size: 17px;
}

.history-delta {
  color: var(--accent-dark);
  font-weight: 800;
  white-space: nowrap;
}

.delete-record {
  width: 36px;
  height: 36px;
  flex: 0 0 36px;
  border: 0;
  border-radius: 50%;
  background: #f3f4f6;
  color: var(--muted);
  font-size: 20px;
  cursor: pointer;
}

@media (max-width: 380px) {
  .hero-panel {
    grid-template-columns: 106px 1fr;
    gap: 14px;
    padding: 16px;
  }

  .gauge {
    width: 106px;
  }

  .gauge-ring {
    width: 78px;
  }

  .gauge-ring span {
    font-size: 23px;
  }

  .hero-copy strong {
    font-size: 20px;
  }

  .stats-grid strong {
    font-size: 15px;
  }
}

</style>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">充电前记录</p>
          <h1>电动车里程</h1>
        </div>
        <div class="top-actions">
          <button class="icon-button" id="importBtn" type="button" aria-label="导入 JSON" title="导入 JSON">
            <span aria-hidden="true">↑</span>
          </button>
          <button class="icon-button" id="exportBtn" type="button" aria-label="导出数据" title="导出数据">
            <span aria-hidden="true">↓</span>
          </button>
          <input id="importFile" type="file" accept="application/json,.json" hidden />
        </div>
      </header>

      <section class="hero-panel" aria-label="本次统计">
        <div class="gauge" aria-hidden="true">
          <div class="gauge-ring">
            <span id="avgDistance">--</span>
            <small>km/次</small>
          </div>
        </div>
        <div class="hero-copy">
          <p>平均每次充电间隔</p>
          <strong id="latestDistance">还没有记录</strong>
          <span id="recordCount">输入第一次总里程后开始追踪</span>
        </div>
      </section>

      <form class="entry-form" id="entryForm" autocomplete="off">
        <label for="mileageInput">当前总里程</label>
        <div class="input-row">
          <input id="mileageInput" name="mileage" type="number" inputmode="decimal" min="0" step="0.1" placeholder="例如 1288.5" required />
          <button type="submit">保存</button>
        </div>
        <p class="form-note" id="formNote">每次充电前输入仪表盘上的总里程。</p>
      </form>

      <section class="stats-grid" aria-label="汇总数据">
        <article>
          <span>最长一次</span>
          <strong id="bestRun">-- km</strong>
        </article>
        <article>
          <span>最短一次</span>
          <strong id="shortRun">-- km</strong>
        </article>
        <article>
          <span>累计记录</span>
          <strong id="totalRecords">0 次</strong>
        </article>
      </section>

      <section class="chart-section" aria-label="每次充电里程图表">
        <div class="section-head">
          <h2>续航趋势</h2>
          <button class="ghost-button" id="clearBtn" type="button">清空</button>
        </div>
        <div class="chart-wrap">
          <canvas id="rangeChart" width="680" height="360"></canvas>
          <p class="empty-chart" id="emptyChart">至少保存 2 次总里程后显示每次充电跑了多少公里。</p>
        </div>
      </section>

      <section class="history-section" aria-label="历史记录">
        <div class="section-head">
          <h2>记录</h2>
          <span id="lastUpdated">--</span>
        </div>
        <ol class="history-list" id="historyList"></ol>
      </section>
    </main>

    <script>
const form = document.querySelector("#entryForm");
const input = document.querySelector("#mileageInput");
const note = document.querySelector("#formNote");
const historyList = document.querySelector("#historyList");
const chart = document.querySelector("#rangeChart");
const emptyChart = document.querySelector("#emptyChart");
const clearBtn = document.querySelector("#clearBtn");
const exportBtn = document.querySelector("#exportBtn");
const importBtn = document.querySelector("#importBtn");
const importFile = document.querySelector("#importFile");

const avgDistance = document.querySelector("#avgDistance");
const latestDistance = document.querySelector("#latestDistance");
const recordCount = document.querySelector("#recordCount");
const bestRun = document.querySelector("#bestRun");
const shortRun = document.querySelector("#shortRun");
const totalRecords = document.querySelector("#totalRecords");
const lastUpdated = document.querySelector("#lastUpdated");
const gauge = document.querySelector(".gauge");

let records = [];
let storageMode = "browser";
const STORAGE_KEY = "ev-charge-mileage-records-v2";

function isServerMode() {
  return location.protocol === "http:" || location.protocol === "https:";
}

function normalizeRecords(nextRecords) {
  return nextRecords
    .filter((item) => Number.isFinite(Number(item.mileage)))
    .map((item) => ({
      id: String(item.id || Date.now()),
      mileage: Number(item.mileage),
      date: item.date || new Date().toISOString(),
    }))
    .sort((a, b) => new Date(a.date) - new Date(b.date));
}

async function loadRecords() {
  if (!isServerMode()) {
    storageMode = "browser";
    const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    return normalizeRecords(Array.isArray(parsed) ? parsed : []);
  }

  const response = await fetch("/api/records");
  if (!response.ok) throw new Error("读取记录失败");
  const parsed = await response.json();
  storageMode = "json";
  return normalizeRecords(Array.isArray(parsed.records) ? parsed.records : []);
}

async function saveRecords(nextRecords) {
  const cleanRecords = normalizeRecords(nextRecords);

  if (storageMode === "browser") {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(cleanRecords));
    records = cleanRecords;
    return;
  }

  const response = await fetch("/api/records", {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
    },
    body: JSON.stringify({ records: cleanRecords }),
  });
  if (!response.ok) throw new Error("保存记录失败");
  const parsed = await response.json();
  records = normalizeRecords(Array.isArray(parsed.records) ? parsed.records : cleanRecords);
}

function storageLabel() {
  return storageMode === "json" ? "data.json" : "本机浏览器";
}

function formatKm(value) {
  if (!Number.isFinite(value)) return "-- km";
  return `${Number(value.toFixed(1)).toLocaleString("zh-CN")} km`;
}

function formatDate(value) {
  return new Intl.DateTimeFormat("zh-CN", {
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
  }).format(new Date(value));
}

function getRuns() {
  return records.slice(1).map((record, index) => ({
    id: record.id,
    date: record.date,
    distance: record.mileage - records[index].mileage,
    mileage: record.mileage,
  }));
}

function setNote(message, isError = false) {
  note.textContent = message;
  note.classList.toggle("error", isError);
}

function renderStats() {
  const runs = getRuns().filter((run) => run.distance >= 0);
  const latestRun = runs.at(-1);
  const average = runs.length ? runs.reduce((sum, run) => sum + run.distance, 0) / runs.length : null;
  const best = runs.length ? Math.max(...runs.map((run) => run.distance)) : null;
  const shortest = runs.length ? Math.min(...runs.map((run) => run.distance)) : null;

  avgDistance.textContent = average === null ? "--" : Number(average.toFixed(1)).toLocaleString("zh-CN");
  latestDistance.textContent = latestRun ? `上次充电跑了 ${formatKm(latestRun.distance)}` : "还没有记录";
  recordCount.textContent = records.length > 1 ? `已计算 ${runs.length} 次充电间隔` : "输入第一次总里程后开始追踪";
  bestRun.textContent = formatKm(best);
  shortRun.textContent = formatKm(shortest);
  totalRecords.textContent = `${records.length} 次`;
  lastUpdated.textContent = records.length ? `最近 ${formatDate(records.at(-1).date)}` : "--";

  const gaugeValue = average === null ? 0 : Math.min(360, Math.max(24, (average / 80) * 360));
  gauge.style.setProperty("--gauge-value", `${gaugeValue}deg`);
}

function renderHistory() {
  historyList.innerHTML = "";

  if (!records.length) {
    const item = document.createElement("li");
    item.className = "history-item";
    item.innerHTML = '<div class="history-main"><strong>暂无记录</strong><span class="history-date">先保存一次总里程</span></div>';
    historyList.appendChild(item);
    return;
  }

  records
    .slice()
    .reverse()
    .forEach((record, reverseIndex) => {
      const index = records.length - 1 - reverseIndex;
      const prev = records[index - 1];
      const delta = prev ? record.mileage - prev.mileage : null;
      const item = document.createElement("li");
      item.className = "history-item";
      item.innerHTML = `
        <div class="history-main">
          <strong>${formatKm(record.mileage)}</strong>
          <span class="history-date">${formatDate(record.date)}</span>
        </div>
        <span class="history-delta">${delta === null ? "起点" : `+${formatKm(delta)}`}</span>
        <button class="delete-record" type="button" aria-label="删除这条记录" data-id="${record.id}">×</button>
      `;
      historyList.appendChild(item);
    });
}

function drawChart() {
  const ctx = chart.getContext("2d");
  const ratio = window.devicePixelRatio || 1;
  const rect = chart.getBoundingClientRect();
  chart.width = Math.max(1, Math.floor(rect.width * ratio));
  chart.height = Math.max(1, Math.floor(rect.height * ratio));
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  ctx.clearRect(0, 0, rect.width, rect.height);

  const runs = getRuns().filter((run) => run.distance >= 0);
  emptyChart.hidden = runs.length === 0 ? false : true;
  if (!runs.length) return;

  const width = rect.width;
  const height = rect.height;
  const padding = { top: 18, right: 18, bottom: 32, left: 44 };
  const plotWidth = width - padding.left - padding.right;
  const plotHeight = height - padding.top - padding.bottom;
  const maxValue = Math.max(20, Math.ceil(Math.max(...runs.map((run) => run.distance)) / 10) * 10);
  const minValue = 0;
  const xStep = runs.length > 1 ? plotWidth / (runs.length - 1) : plotWidth;

  ctx.lineWidth = 1;
  ctx.strokeStyle = "#dde2da";
  ctx.fillStyle = "#6b7280";
  ctx.font = "12px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";

  for (let i = 0; i <= 4; i += 1) {
    const value = minValue + ((maxValue - minValue) / 4) * i;
    const y = padding.top + plotHeight - ((value - minValue) / (maxValue - minValue)) * plotHeight;
    ctx.beginPath();
    ctx.moveTo(padding.left, y);
    ctx.lineTo(width - padding.right, y);
    ctx.stroke();
    ctx.fillText(String(Math.round(value)), 8, y + 4);
  }

  const points = runs.map((run, index) => ({
    x: padding.left + (runs.length === 1 ? plotWidth / 2 : index * xStep),
    y: padding.top + plotHeight - ((run.distance - minValue) / (maxValue - minValue)) * plotHeight,
    value: run.distance,
  }));

  const gradient = ctx.createLinearGradient(0, padding.top, 0, height - padding.bottom);
  gradient.addColorStop(0, "rgba(15, 118, 110, 0.28)");
  gradient.addColorStop(1, "rgba(15, 118, 110, 0.02)");

  ctx.beginPath();
  points.forEach((point, index) => {
    if (index === 0) ctx.moveTo(point.x, point.y);
    else ctx.lineTo(point.x, point.y);
  });
  ctx.lineTo(points.at(-1).x, height - padding.bottom);
  ctx.lineTo(points[0].x, height - padding.bottom);
  ctx.closePath();
  ctx.fillStyle = gradient;
  ctx.fill();

  ctx.beginPath();
  points.forEach((point, index) => {
    if (index === 0) ctx.moveTo(point.x, point.y);
    else ctx.lineTo(point.x, point.y);
  });
  ctx.lineWidth = 3;
  ctx.strokeStyle = "#0f766e";
  ctx.stroke();

  points.forEach((point, index) => {
    ctx.beginPath();
    ctx.fillStyle = index === points.length - 1 ? "#d97706" : "#0f766e";
    ctx.arc(point.x, point.y, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#18212f";
    ctx.fillText(Number(point.value.toFixed(1)).toString(), point.x - 10, point.y - 10);
  });
}

function render() {
  renderStats();
  renderHistory();
  drawChart();
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const mileage = Number(input.value);
  const previous = records.at(-1);

  if (!Number.isFinite(mileage) || mileage < 0) {
    setNote("请输入有效的总里程。", true);
    return;
  }

  if (previous && mileage <= previous.mileage) {
    setNote(`新里程需要大于上一次记录：${formatKm(previous.mileage)}。`, true);
    return;
  }

  const nextRecords = records.concat({
    id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
    mileage,
    date: new Date().toISOString(),
  });

  try {
    await saveRecords(nextRecords);
    input.value = "";
    setNote(`已保存到${storageLabel()}。下次充电前再输入新的总里程。`);
    render();
  } catch {
    setNote("保存失败，请刷新后重试。", true);
  }
});

historyList.addEventListener("click", async (event) => {
  const button = event.target.closest(".delete-record");
  if (!button) return;
  try {
    await saveRecords(records.filter((record) => record.id !== button.dataset.id));
    setNote(`记录已删除，并已保存到${storageLabel()}。`);
    render();
  } catch {
    setNote("删除失败，请刷新后重试。", true);
  }
});

clearBtn.addEventListener("click", async () => {
  if (!records.length) return;
  const confirmed = window.confirm("确定清空所有里程记录吗？");
  if (!confirmed) return;
  try {
    await saveRecords([]);
    setNote(`全部记录已清空，并已保存到${storageLabel()}。`);
    render();
  } catch {
    setNote("清空失败，请刷新后重试。", true);
  }
});

exportBtn.addEventListener("click", () => {
  const blob = new Blob([JSON.stringify({ records }, null, 2)], { type: "application/json;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "电动车充电里程记录.json";
  link.click();
  URL.revokeObjectURL(url);
});

importBtn.addEventListener("click", () => {
  importFile.click();
});

importFile.addEventListener("change", async () => {
  const file = importFile.files[0];
  if (!file) return;

  try {
    const payload = JSON.parse(await file.text());
    const importedRecords = Array.isArray(payload.records) ? payload.records : payload;
    await saveRecords(normalizeRecords(importedRecords));
    setNote(`已导入 ${records.length} 条记录，并保存到${storageLabel()}。`);
    render();
  } catch {
    setNote("导入失败，请选择正确的 JSON 备份文件。", true);
  } finally {
    importFile.value = "";
  }
});

window.addEventListener("resize", drawChart);

async function init() {
  try {
    records = await loadRecords();
    render();
    setNote(`当前使用${storageLabel()}保存。`);
  } catch {
    storageMode = "browser";
    try {
      records = normalizeRecords(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));
    } catch {
      records = [];
    }
    render();
    setNote("当前使用本机浏览器保存。");
  }
}

init();

</script>
  </body>
</html>
